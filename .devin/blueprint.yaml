initialize:
  - uses: github.com/actions/setup-python@v5
    with:
      python-version: "3.12"

maintenance: |
  python -m pip install --editable ".[dev]"

knowledge:
  - name: quality
    contents: ruff check app tests alembic && mypy app
  - name: tests
    contents: pytest
  - name: coverage
    contents: pytest --cov=app --cov-report=term-missing
  - name: containers
    contents: docker compose up -d --build
  - name: migrations
    contents: docker compose run --rm migrate alembic upgrade head
