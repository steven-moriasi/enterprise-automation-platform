services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: automation
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &application-environment
      AUTOMATION_DATABASE_URL: postgresql+psycopg://automation:automation@postgres:5432/automation
      AUTOMATION_REDIS_URL: redis://redis:6379/0
      AUTOMATION_AUTH_ENABLED: "false"
      AUTOMATION_WEBHOOK_SIGNING_SECRET: local-development-webhook-secret
      AUTOMATION_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *application-environment
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *application-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment: *application-environment
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
